<article class="glass panel" style="{{st.panelStyle}}">
<div class="visual" style="{{st.visStyle}}"><sc-if value="{{st.hasStat}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 22px; bottom: 18px; display: flex; flex-direction: column; gap: 10px"><span style="font: 300 128px/.9 Josefin Sans, Futura, sans-serif; letter-spacing: -0.03em; color: #FBE9DC">{{st.stat}}</span><span style="font: 600 12px/1 Josefin Sans, Futura, sans-serif; letter-spacing: .24em; text-transform: uppercase; color: rgba(251,233,220,.86)">{{st.statLabel}}</span></div></sc-if></div>
<div class="glass-dark {{st.cardCls}}" style="position: relative; z-index: 2; border-radius: 18px; padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; margin: 0 -12px -12px">
<h3 style="margin: 0; font: 600 24px/1.2 Josefin Sans, Futura, sans-serif">{{st.title}}</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: rgba(251,233,220,.86)">{{st.body}}</p>
</div>
</article>
</sc-for>
</div>
</section>
</sc-for>
<footer class="pad sitefoot" style="margin-top: 120px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; font: 500 13px/1 Josefin Sans, Futura, sans-serif; letter-spacing: .24em; text-transform: uppercase; color: rgba(251,233,220,.86)">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">

<button type="button" class="motionbtn" onClick="{{onToggleMotion}}" aria-pressed="{{motionPressed}}">
<sc-if value="{{isPaused}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"></path></svg></sc-if>
<sc-if value="{{isPlaying}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"></rect><rect x="14" y="4.5" width="4" height="15" rx="1"></rect></svg></sc-if>
<span>{{motionLabel}}</span>
</button>
</div>
<p style="margin: 0; font: 400 15px/1.4 'Proxima Nova', Figtree, system-ui, sans-serif; letter-spacing: 0; text-transform: none; color: rgba(251,233,220,.88)">I vibe-coded this website, <a class="tlink" href="Process.dc.html">see how</a>.</p>
</footer>
</div>
</div>
</div>

      rootClass: [(this.props.motion ?? true) && !(this.state && this.state.paused) ? '' : 'still', this.props.skipIntro ? 'nointro' : '', this.themeKey() === 'cake' ? 'cake' : 'lava', 'site'].join(' ').trim(),
      themeNow: (this.themeNow = this.themeKey()),
      lavaPressed: this.themeKey() !== 'cake' ? 'true' : 'false',
      cakePressed: this.themeKey() === 'cake' ? 'true' : 'false',
      onLava: () => this.setTheme('lava'),
      onCake: () => this.setTheme('cake'),
      hdrCls: 'pad hdr' + (this._hdrOn ? ' hdr-on' : '') + (this._hdrFit ? ' hdr-fit' : ''),
      hdrGlassCls: 'hdrglass' + (this._hdrOn ? ' on' : ''),
      hdrRef: (el) => { if (el && el !== this.hdrEl) { this.hdrEl = el; this.hdrInit(); } },
      cakeRef: (el) => { if (el && el !== this.cakeCv) { this.cakeCv = el; if (CAKE_GENERATED) cakeEngine(this, el); else cakeStatic(this, el); } },
      isPaused: !!(this.state && this.state.paused),
      isPlaying: !(this.state && this.state.paused),
      motionLabel: (this.state && this.state.paused) ? 'Start motion' : 'Stop motion',
      motionPressed: (this.state && this.state.paused) ? 'true' : 'false',
      onToggleMotion: () => this.setState({ paused: !(this.state && this.state.paused) }),
      onLogo: (e) => { if (typeof this.props.onLogo === 'function') { if (e && e.preventDefault) e.preventDefault(); this.props.onLogo(); } },
      p: P[mood] || P.clay,
      projects: list.map((x) => ({
        ...x,
        steps: story(x.title, x),
        logoStyle: 'height: ' + x.lh + 'px; width: ' + Math.round(x.lh * LOGOS[x.logo].r) + 'px; -webkit-mask-image: url(' + LOGOS[x.logo].u + '); mask-image: url(' + LOGOS[x.logo].u + ')',
        secStyle: x.n === '01' ? 'margin-top: 72px' : 'margin-top: var(--csgap, 120px)',
        barStyle: 'width: ' + Math.round(20 + 80 * (prog[x.id] || 0)) + '%',
        trackRef: (el) => { this.tracks = this.tracks || {}; this.tracks[x.id] = el; if (el && !el.__swipe) { el.__swipe = 1; let sx = 0, sy = 0, on = false; el.addEventListener('touchstart', (e) => { if (!document.documentElement.classList.contains('rows-paged')) return; const t = e.touches[0]; sx = t.clientX; sy = t.clientY; on = true; }, { passive: true }); el.addEventListener('touchend', (e) => { if (!on) return; on = false; const t = e.changedTouches[0]; const dx = t.clientX - sx, dy = t.clientY - sy; if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.2) this.step(x.id, dx < 0 ? 1 : -1); }, { passive: true }); } },
        secRef: (el) => { this.secs = this.secs || {}; if (el && this.io && this.secs[x.id] !== el) this.io.observe(el); this.secs[x.id] = el; },
        prev: () => this.step(x.id, -1),
        next: () => this.step(x.id, 1),
        onScroll: (e) => {
          const el = e.currentTarget;
          cancelAnimationFrame(this.raf);
          this.raf = requestAnimationFrame(() => {
            const max = el.scrollWidth - el.clientWidth;
            const v = max > 0 ? el.scrollLeft / max : 0;
            const cur = ((this.state || {}).prog || {});
            if (Math.abs((cur[x.id] || 0) - v) > 0.01) this.setState({ prog: { ...cur, [x.id]: v } });
          });
        }
      }))
    };
  }
}
</script>
