// Still-background painter: when BG_MOTION is false, the blurred colour blobs are
// painted once into a small canvas (cheap to scroll) instead of live CSS blur layers.
const bgPaint = (root) => {
  if (BG_MOTION || !root) return;
  const layers = new Set();
  root.querySelectorAll('.blob, .cblob').forEach((b) => b.parentElement && layers.add(b.parentElement));
  const K = 0.125;
  layers.forEach((layer) => {
    const W = layer.clientWidth, H = layer.clientHeight;
    if (!W || !H) return;
    const old = layer.querySelector(':scope > canvas.blobcv'); if (old) old.remove();
    let cv = layer.__bgcv; if (!cv) { cv = layer.__bgcv = document.createElement('canvas'); }
    const cw = Math.max(8, Math.ceil(W * K)), ch = Math.max(8, Math.ceil(H * K));
    if (cv.width !== cw) cv.width = cw;
    if (cv.height !== ch) cv.height = ch;
    const ctx = cv.getContext('2d'); if (!ctx) return;

      backStyle: keysOn || intro === 11 || open ? 'opacity: 0; pointer-events: none' : (intro === 4 ? 'opacity: 1' : 'opacity: 1; pointer-events: none'),
      onFlip: () => this.flip(),
      onReset: () => this.reset(),
      navStyle: open ? 'opacity: 1; transform: none' : 'opacity: 0; transform: translateY(10px); pointer-events: none',
      panelPos: open
        ? 'left: ' + L + '; top: calc(clamp(40px, 6vw, 88px) + 170px); width: min(860px, calc(100% - 2 * var(--gut))); height: clamp(360px, 50vh, 460px)'
        : 'left: calc(50% - ' + PW + ' / 2); top: calc(var(--gy, 50vh) + ' + pTop.toFixed(1) + 'px); width: ' + PW + '; height: ' + pH + 'px; ' + (intro >= 4 ? 'opacity: 1; transform: none' : 'opacity: 0; transform: translateY(80px)'),
      panelTilt: 'transform: none; --tilt: ' + (open ? 0 : tilt) + 'deg',
      bobClass: open ? '' : 'bob',
      cardInner: 'opacity: 0; pointer-events: none',
      cardTab: open ? '0' : '-1',
      peekStyle: open
        ? 'left: 110%; opacity: 0'
        : 'left: 110%; opacity: 0',
      showHome: s.phase === 'home' || !!s.kh,
      showKh: !!s.kh,
      ovClass: (s.kh ? 'kh' : (s.khDone ? '' : 'ovin')) + (inFlow ? ' ovflow' : ''),
      ovRef: (el) => { this.ovEl = el; },
      khRef: (el) => { this.khEl = el; },
      moodKey: key,
      shakeClass: s.shake ? 'shake' : '',
      message: s.msg || '',
      enterStyle: 'opacity: ' + (pw ? 1 : 0.4),
      isKeys: mode === 'keys',
      rootMinH: 660,
      isText: mode !== 'keys',
      faceStyle: '--kc: 5; --kg: ' + kgPx.toFixed(2) + 'px; --ks: ' + ksPx.toFixed(2) + 'px; transform-origin: 50% 100%; transform: perspective(1400px) rotateX(' + (keysOn ? '0deg' : 'var(--tilt, 18deg)') + '); ' + (open ? 'opacity: 0; pointer-events: none' : (keysOn ? 'opacity: 1; transition: transform .75s cubic-bezier(.25,1.25,.4,1), opacity .08s linear' : (intro === 11 ? 'opacity: 0; pointer-events: none; transition: transform .4s cubic-bezier(.55,0,.8,.4), opacity .3s ease .12s' : 'opacity: 0; transition: none; pointer-events: none'))),
      keysAll: [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(mk),
      onPadKey: (e) => { if (e.key === 'Backspace') { e.preventDefault(); this.back(); } },
      onType: (e) => this.setState({ pw: e.target.value, msg: '' }),
      onKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); this.unlock(); } },
      onSubmit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.unlock(); }
    };
  }
  startIntro() {
    (this.ti || []).forEach(clearTimeout);
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || (this.props.motion ?? true) === false || (this.props.intro ?? true) === false) {
      this.ti = [];
      this.setState({ intro: 4 });
    } else {
      this.ti = [[60, 1], [380, 2], [800, 3], [1100, 4]].map(([t, v]) => setTimeout(() => this.setState({ intro: v }), t));
    }
  }
  keyhole() {
    const HP = [[12, 21.2], ['C', 11.2, 20.6, 1.6, 14.6, 1.6, 8.6], ['C', 1.6, 5.6, 3.9, 3.4, 6.8, 3.4], ['C', 8.9, 3.4, 10.7, 4.6, 12, 6.4], ['C', 13.3, 4.6, 15.1, 3.4, 17.2, 3.4], ['C', 20.1, 3.4, 22.4, 5.6, 22.4, 8.6], ['C', 22.4, 14.6, 12.8, 20.6, 12, 21.2]];
    const heartD = (px, py, k) => {
      const f = (n) => (n * k).toFixed(2);
      let d = 'M' + (px + HP[0][0] * k).toFixed(2) + ' ' + (py + HP[0][1] * k).toFixed(2);
      for (let i = 1; i < HP.length; i++) { const c = HP[i]; d += ' C' + [1, 3, 5].map((q) => (px + c[q] * k).toFixed(2) + ' ' + (py + c[q + 1] * k).toFixed(2)).join(' '); }
      return d + ' Z';
    };
    this.setState({ kh: true });
    const go = () => {
      const ov = this.ovEl, line = this.khEl;
      const heart = ov && (ov.querySelector('.heart svg') || ov.querySelector('.heart'));
      if (!ov || !line || !heart) { this.khRaf = requestAnimationFrame(go); return; }
      const paths = line.querySelectorAll('path');
      const o = ov.getBoundingClientRect(), h = heart.getBoundingClientRect();
      const W = o.width, OH = o.height, H = Math.min(OH, window.innerHeight - Math.max(0, o.top));
      const s1 = h.width, x1 = h.left - o.left + s1 / 2, y1 = h.top - o.top + 12.3 * s1 / 24, w1 = 2 * s1 / 24;
      const x0 = x1, y0 = y1;
      const ctx = document.createElement('canvas').getContext('2d');
      const edge = [];
      for (let i = 0; i <= 10; i++) { edge.push([W * i / 10, 0], [W * i / 10, H], [0, H * i / 10], [W, H * i / 10]); }
      const covers = (sz) => { const p = new Path2D(heartD(x1 - sz / 2, y1 - 12.3 * sz / 24, sz / 24)); return edge.every(([a, b]) => ctx.isPointInPath(p, a, b)); };
      let s0 = Math.max(W, H);
      while (!covers(s0) && s0 < 20000) s0 *= 1.08;
      s0 *= 1.1;
      const apply = (x, y, sz) => {
        const k = sz / 24, d = heartD(x - sz / 2, y - 12.3 * k, k);
        ov.style.clipPath = "path(evenodd, 'M0 0 H" + W + ' V' + OH + ' H0 Z ' + d + "')";
        paths.forEach((p) => p.setAttribute('d', d));
        const e2 = Math.min(1, Math.max(0, (k - s1 / 24 * 1) / ((s0 - s1) / 24 * 0.15)));
        paths[1].setAttribute('stroke-width', (w1 + (2.2 - w1) * e2).toFixed(2));
        paths[0].style.opacity = String(e2);
      };
      apply(x0, y0, s0);
      line.style.opacity = '1';
      const t0 = performance.now(), D = 1500;
      const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const tick = (now) => {
        const t = Math.max(0, Math.min(1, (now - t0) / D)), e = ease(t);
        apply(x0 + (x1 - x0) * e, y0 + (y1 - y0) * e, s0 * Math.pow(s1 / s0, e));
        if (t < 1) { this.khRaf = requestAnimationFrame(tick); return; }
        this.t2 = setTimeout(() => {
          ov.style.clipPath = '';
          line.style.opacity = '0'; ov.classList.remove('kh');
          this.t6 = setTimeout(() => this.setState({ phase: 'home', khDone: true, kh: false }), 380);
        }, 120);
      };
      this.khRaf = requestAnimationFrame(tick);
    };
    this.khRaf = requestAnimationFrame(go);
  }
  reset() {
    cancelAnimationFrame(this.khRaf); clearTimeout(this.t6);
    [this.t0, this.t1, this.t2, this.t3, this.t4, this.t5, this.th, this.tu].forEach(clearTimeout);
    (this.ti || []).forEach(clearTimeout); this.ti = [];
    this.seqNow = [];
    try { window.scrollTo(0, 0); } catch (e) {}
    this.setState({ intro: 0, pdown: false, phase: null, kh: false, khDone: false, unlatched: false, seq: [], hit: null, msg: '', shake: false, bad: false, pw: '', backLabel: '' });
    clearTimeout(this.tr);
    this.tr = setTimeout(() => this.startIntro(), 120);
  }
  flip() {
    const st = this.state || {};
    if (st.intro !== 4) return;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || (this.props.motion ?? true) === false || st.paused) { this.setState({ intro: 7, pdown: false }); return; }
    const held = st.pdown ? Date.now() - (this.pdAt || 0) : 0;
    const wait = Math.max(0, 110 - held);
    if (!st.pdown) this.setState({ pdown: true });
    this.ti = (this.ti || []).concat([
      setTimeout(() => this.setState({ pdown: false, intro: 10 }), wait),
      setTimeout(() => this.setState({ intro: 7 }), wait + 950)
    ]);
  }

  press(d) {
    const st = this.state || {};
    if (st.phase || st.unlatched || st.bad || (st.intro != null && st.intro !== 7 && st.intro !== 10)) return;
    const code = this.cleanCode();
    const n = code.length >= 3 ? code.length : (this.props.codeLength || 4);
    const cur = this.seqNow || st.seq || [];
    const seq = cur.indexOf(d) >= 0 ? cur.filter((x) => x !== d) : cur.concat(d).slice(0, n);
    this.seqNow = seq;
    this.setState({ seq, hit: d, msg: '' });
    clearTimeout(this.th); this.th = setTimeout(() => this.setState({ hit: null }), 220);
    clearTimeout(this.tu);
    if (seq.length >= n) this.tu = setTimeout(() => this.unlock(), 420);
  }
  cleanCode() {
    const out = [];
    String(this.props.passcode || '3026').replace(/[^0-9]/g, '').split('').forEach((c) => { if (out.indexOf(c) < 0) out.push(c); });
    return out.join('').slice(0, 10);
  }
  back() {
    const st = this.state || {};
    if (st.phase || st.unlatched || st.bad) return;
    const seq = (this.seqNow || st.seq || []).slice(0, -1); this.seqNow = seq;
    this.setState({ seq, msg: '' });
  }
  unlock() {
        const st = this.state || {};
        if (st.phase || st.unlatched) return;
        const mode = this.props.entry === 'text' ? 'text' : 'keys';
        let ok;
        if (mode === 'keys') {
          const code = this.cleanCode();
          const n = code.length >= 3 ? code.length : (this.props.codeLength || 4);
          const got = (this.seqNow || st.seq || []).join('');
          if (got.length < n) { this.setState({ msg: 'Press ' + n + ' keys.' }); return; }
          ok = !code || got === code.slice(0, n);
        } else {
          const pw = String(st.pw || '');
          const want = String(this.props.password || '').trim().toLowerCase();
          if (!pw.trim()) { this.setState({ msg: 'Type a password first.' }); return; }
          ok = !want || pw.trim().toLowerCase() === want;
        }
        if (ok) {
          this.setState({ unlatched: true, msg: '' });
          clearTimeout(this.t0); clearTimeout(this.t1);
          const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (reduce || (this.props.motion ?? true) === false || st.paused) {
            this.t1 = setTimeout(() => this.setState({ phase: 'home' }), 700);
          } else {
            this.t0 = setTimeout(() => this.keyhole(), 600);
          }
        } else {
          this.setState({ shake: true, bad: true, msg: '' });
          clearTimeout(this.t3); clearTimeout(this.t4); clearTimeout(this.t5);
          this.t3 = setTimeout(() => this.setState({ intro: 11, shake: false, backLabel: 'Try again' }), 750);
          this.t4 = setTimeout(() => { this.seqNow = []; this.setState({ intro: 4, bad: false, seq: [] }); }, 1150);
          clearTimeout(this.t2);
        }
  }
}
</script>
